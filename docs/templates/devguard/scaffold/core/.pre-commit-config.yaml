default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b
    hooks:
      - id: check-added-large-files
        args: [--maxkb=10000]
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c59bba8fb259db0fec2bbb77ad8ba51ea7341b56
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: 107a41827bb6698dbbff756b2300537774a1d84c
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: devguard-verify
        name: DevGuard fail-closed verification
        entry: python scripts/devguard.py verify
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: conventional-commit
        name: Conventional Commit message
        entry: python scripts/devguard.py commit-msg
        language: system
        stages: [commit-msg]
