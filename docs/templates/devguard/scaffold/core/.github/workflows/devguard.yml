name: DevGuard

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 钉版（R5-13）
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 钉版（R5-13）
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install declared governance dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify scaffold closure
        run: python scripts/devguard.py verify
      - name: Run all pre-commit gates
        run: python -m pre_commit run --all-files --show-diff-on-failure
      - name: Run governance tests
        run: python -m pytest tests/governance -q
