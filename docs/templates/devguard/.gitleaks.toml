# ============================================================
# .gitleaks.toml — gitleaks 密钥扫描配置（2026-08-13 红队 N-1 改造）
# ============================================================
# 模式：[extend] useDefault=true —— 继承二进制内置默认规则（208 条），
# 本文件只写增量。上游演进（新探测器/allowlist 结构变更）自动生效，
# 杜绝「复制默认规则随上游腐化」类风险（红队外源情报 N-1）。
# 增量：src/coding 教学反例豁免（故意违规模式用于教学，非真实泄漏）。
# 模板版本：docs/templates/devguard/.gitleaks.toml（与仓根逐字节一致）
# ============================================================

[extend]
useDefault = true

[allowlist]
description = "教学反例豁免（默认 allowlist 自动继承并 append 合并）"
paths = [
    '''src/coding/security_demo\.py''',
    '''src/coding/naming_bad\.py''',
    '''src/coding/error_handling_demo\.py''',
    '''src/code-understanding/call_graph_example\.py''',
]
